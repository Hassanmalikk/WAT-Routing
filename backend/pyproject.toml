[project]
name = "wat-routing"
version = "1.0.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-ninja>=1.7.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "ASYNC", "PL", "N"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
